spring:
  application:
    name: bureau-release-system
  datasource:
    driver-class-name: org.postgresql.Driver
oci:
  registry:
    accept-manifest-types:
      - application/vnd.oci.image.index.v1+json
      - application/vnd.oci.image.manifest.v1+json
feign:
  httpclient:
    enabled: true
    maxConnections: 200
    maxConnectionsPerRoute: 50
    connectionTimeToLive: 10
  client:
    config:
      oci-registry-client:
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: basic
        forceDecoding: true